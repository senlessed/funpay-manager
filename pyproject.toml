[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "funpay-telegram-manager"
version = "0.1.0.dev0"
description = "Local Windows manager for FunPay and Telegram"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "GPL-3.0-only"
dependencies = [
  "PySide6>=6.8,<7",
  "aiosqlite>=0.20,<1",
  "pydantic-settings>=2.7,<3",
  "keyring>=25,<26",
]

[project.optional-dependencies]
telegram = ["aiogram>=3.13,<4"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]
build = ["pyinstaller>=6.16,<7"]

[project.gui-scripts]
funpay-manager = "funpay_manager.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
